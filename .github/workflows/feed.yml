name: Build RSS feed

on:
  push:
    branches:
      - main
    paths:
      - "reports/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build feed.xml
        run: python scripts/build_feed.py

      - name: Commit and push feed.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          if git diff --staged --quiet; then
            echo "feed.xml is up to date"
          else
            git commit -m "chore: update feed.xml"
            git push
          fi
